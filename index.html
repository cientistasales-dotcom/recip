<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reciclar é Transformar</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

img{
    max-width:90%;
    max-height:90%;
    border-radius:20px;
}
</style>
</style>
</head>
<body>

<div id="container">
    <img id="foto">
    <p id="texto"></p>
</div>

<script>

const cards = [

{
    imagem:"img01.jpg",
    texto:"Uma garrafa plástica pode levar mais de 400 anos para se decompor."
},

{
    imagem:"img02.jpg",
    texto:"Cerca de 8 milhões de toneladas de plástico chegam aos oceanos todos os anos."
},

{
    imagem:"img03.jpg",
    texto:"Apenas 9% de todo o plástico produzido já foi reciclado."
},

{
    imagem:"img04.jpg",
    texto:"O plástico descartado hoje pode permanecer no ambiente por séculos."
},

{
    imagem:"img05.jpg",
    texto:"Mais de 100 mil animais marinhos morrem anualmente por causa do plástico."
},

{
    imagem:"img06.jpg",
    texto:"Uma única garrafa PET pode ganhar diversas novas vidas através da reciclagem."
},

{
    imagem:"img07.jpg",
    texto:"Separar corretamente o plástico reduz a quantidade de lixo nos aterros."
},

{
    imagem:"img08.jpg",
    texto:"Até 2050 pode haver mais plástico do que peixes nos oceanos."
},

{
    imagem:"img09.jpg",
    texto:"O plástico reciclado pode virar roupas, móveis e até equipamentos urbanos."
},

{
    imagem:"img10.jpg",
    texto:"Cada embalagem reciclada representa menos extração de petróleo."
},

{
    imagem:"img11.jpg",
    texto:"O plástico é produzido principalmente a partir de derivados do petróleo."
},

{
    imagem:"img12.jpg",
    texto:"Reciclar uma garrafa hoje ajuda a preservar os recursos do amanhã."
},

{
    imagem:"img13.jpg",
    texto:"Pequenas atitudes diárias geram grandes impactos ambientais."

}

];

const card = cards[Math.floor(Math.random() * cards.length)];

document.getElementById("foto").src = card.imagem;
document.getElementById("texto").innerText = card.texto;

</script>

</body>
</html>
